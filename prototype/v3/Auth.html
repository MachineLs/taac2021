<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · 光合</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&amp;family=Noto+Sans+SC:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#161616}a:hover{color:#4D4D4D}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #161616;outline-offset:2px}
</style>
</head>
<body>
<div style="background: #FFFFFF; color: #161616; font-family: 'Manrope', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; padding-bottom: 96px">
<header style="border-bottom: 1px solid #EFEFEF">
<div style="max-width: 1128px; margin: 0 auto; padding: 0 32px; min-height: 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px">
<a href="Main.html" style="font-size: 20px; font-weight: 600; letter-spacing: 0.08em; color: #161616; text-decoration: none">光合</a>
<span style="margin-left: auto; font-size: 14px; color: #6B6B6B">已有账号？<a href="Main.html" style="font-weight: 600; text-decoration: none">登录</a></span>
</div>
</header>

<div style="max-width: 1128px; margin: 0 auto; padding: 48px 32px 0; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 64px">

<section aria-label="光合上的作品" style="flex: 1 1 440px; min-width: 0; max-width: 560px">
<div style="display: grid; grid-template-columns: 3fr 2fr; grid-template-rows: 1fr 1fr; gap: 12px; height: 520px">
<a href="Work.html" style="grid-row: span 2; display: block; border-radius: 12px; overflow: hidden; background: #EFEFEF"><svg viewBox="0 0 400 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="林夏的作品：午后逆光人像" style="display: block"><defs><linearGradient id="p1-u1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6E2C6"></stop><stop offset="1" stop-color="#E3A07A"></stop></linearGradient></defs><rect width="400" height="500" fill="url(#p1-u1) #EDC3A0"></rect><circle cx="300" cy="150" r="80" fill="#FFF4E2" opacity="0.7"></circle><path d="M0 372c90-26 160-10 230-26s120-2 170-10v164H0z" fill="#C4876A" opacity="0.5"></path><path d="M200 178c-62 0-78 58-72 122 4 52-8 96-24 140h192c-16-44-28-88-24-140 6-64-10-122-72-122z" fill="#2B201D"></path><path d="M64 500c10-80 64-136 136-144 72 8 126 64 136 144z" fill="#3A4644"></path><path d="M182 296h36v66c-12 8-24 8-36 0z" fill="#B97F66"></path><ellipse cx="200" cy="262" rx="46" ry="56" fill="#D69C7F"></ellipse><path d="M152 252c-4-46 22-68 52-68 34 0 52 28 46 66-14-22-36-32-58-30-16 2-30 14-40 32z" fill="#2B201D"></path></svg></a>
<a href="Profile.html" style="display: block; border-radius: 12px; overflow: hidden; background: #EFEFEF"><svg viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="陈屿的作品：茶饮品牌短片" style="display: block"><defs><linearGradient id="p2-u2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E4E5A"></stop><stop offset="0.55" stop-color="#C98A5E"></stop><stop offset="1" stop-color="#E7B27C"></stop></linearGradient></defs><rect width="800" height="450" fill="url(#p2-u2) #7A6E60"></rect><circle cx="600" cy="252" r="38" fill="#FBE3B8" opacity="0.9"></circle><path d="M0 270c140-30 260-8 400-26s260 6 400-8v214H0z" fill="#3C5A55"></path><path d="M0 318c160-26 300 2 460-18s240 0 340-8v158H0z" fill="#2B4641"></path><path d="M0 362c200-20 420 2 800-26M0 396c220-22 460 4 800-28M0 430c240-22 500 4 800-28" fill="none" stroke="#3F625A" stroke-width="10" stroke-linecap="round"></path><path d="M230 332l11-58h20l11 58z" fill="#1A2624"></path><circle cx="251" cy="262" r="10" fill="#1A2624"></circle><path d="M231 258h40l-20-14z" fill="#1A2624"></path></svg></a>
<a href="Profile.html" style="display: block; border-radius: 12px; overflow: hidden; background: #EFEFEF"><svg viewBox="0 0 400 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="周沐的作品：护肤品主图精修" style="display: block"><rect width="400" height="500" fill="#F1EBE3"></rect><rect y="336" width="400" height="164" fill="#E6DCCF"></rect><ellipse cx="200" cy="350" rx="112" ry="22" fill="#EEE6DB"></ellipse><rect x="160" y="196" width="80" height="154" rx="20" fill="#C9B7D3"></rect><rect x="176" y="156" width="48" height="46" rx="7" fill="#3B3346"></rect><rect x="168" y="256" width="64" height="46" rx="5" fill="#F6F2EC"></rect></svg></a>
</div>
<p style="margin: 12px 0 0; font-size: 12px; color: #6B6B6B">作品来自林夏、陈屿、周沐</p>
<ul style="list-style: none; margin: 0; padding: 0; margin-top: 32px; display: flex; flex-direction: column; gap: 12px; font-size: 16px; color: #333333">
<li style="display: flex; align-items: center; gap: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>一张名片放下作品、服务和档期</li>
<li style="display: flex; align-items: center; gap: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>客户直接预约，定金由平台托管</li>
<li style="display: flex; align-items: center; gap: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>看到合适的合作需求，用名片一键申请</li>
</ul>
</section>

<main style="flex: 1 1 360px; min-width: 0; max-width: 420px">
<h1 style="margin: 0; font-size: 32px; font-weight: 600; line-height: 1.25">加入光合</h1>
<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.6; color: #6B6B6B">摄影、修图和视频创作者的名片平台。</p>

<div role="tablist" aria-label="注册或登录" style="display: flex; flex-wrap: wrap; gap: 0 24px; border-bottom: 1px solid #EFEFEF; margin-top: 24px">
<button role="tab" aria-selected="true" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0; border: 0; background: transparent; color: #161616; font: inherit; font-size: 16px; text-decoration: none; cursor: pointer; font-weight: 600; box-shadow: inset 0 -2px 0 #161616">注册</button>
<button role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0; border: 0; background: transparent; color: #6B6B6B; font: inherit; font-size: 16px; text-decoration: none; cursor: pointer">登录</button>
</div>

<form style="margin-top: 24px">
<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; font-size: 14px; font-weight: 600; color: #333333">你想用光合做什么</legend>
<div role="radiogroup" style="margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(160px, 100%), 1fr)); gap: 12px">
<label style="display: flex; gap: 12px; padding: 15px; border: 2px solid #161616; border-radius: 8px; cursor: pointer; flex-direction: column; gap: 8px"><span style="display: flex; align-items: center; justify-content: space-between"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.3l1.6-2.5h5.2L16.2 7h2.3A1.5 1.5 0 0 1 20 8.5v9.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"></path><circle cx="12" cy="13" r="3.5"></circle></svg><input type="radio" name="role" checked="checked" style="flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: #161616; margin: 0"></span><span style="font-size: 14px; font-weight: 600">我是创作者</span><span style="font-size: 12px; line-height: 1.5; color: #6B6B6B">展示作品，接预约和合作需求</span></label>
<label style="display: flex; gap: 12px; padding: 16px; border: 1px solid #CDCDCD; border-radius: 8px; cursor: pointer; flex-direction: column; gap: 8px"><span style="display: flex; align-items: center; justify-content: space-between"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4.2-4.2"></path></svg><input type="radio" name="role" style="flex: none; width: 18px; height: 18px; margin: 2px 0 0; accent-color: #161616; margin: 0"></span><span style="font-size: 14px; font-weight: 600">我要找创作者</span><span style="font-size: 12px; line-height: 1.5; color: #6B6B6B">预约拍摄、修图，发布合作需求</span></label>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; margin-top: 24px">
<label for="au-phone" style="font-size: 14px; font-weight: 600; color: #333333">手机号</label>
<div style="display: flex; gap: 8px">
<select aria-label="国家或地区区号" style="width: 100%; min-width: 0; height: 48px; padding: 0 12px; box-sizing: border-box; border: 1px solid #CDCDCD; border-radius: 8px; background: #FFFFFF; color: #161616; font: inherit; font-size: 16px; width: 96px; flex: none"><option>+86</option><option>+852</option><option>+853</option><option>+886</option></select>
<input id="au-phone" type="tel" inputmode="tel" autocomplete="tel" value="138 0000 2046" style="width: 100%; min-width: 0; height: 48px; padding: 0 12px; box-sizing: border-box; border: 1px solid #CDCDCD; border-radius: 8px; background: #FFFFFF; color: #161616; font: inherit; font-size: 16px; font-variant-numeric: tabular-nums">
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0; margin-top: 24px">
<label for="au-code" style="font-size: 14px; font-weight: 600; color: #333333">验证码</label>
<div style="display: flex; gap: 8px">
<input id="au-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位数字" aria-describedby="au-code-hint" style="width: 100%; min-width: 0; height: 48px; padding: 0 12px; box-sizing: border-box; border: 1px solid #CDCDCD; border-radius: 8px; background: #FFFFFF; color: #161616; font: inherit; font-size: 16px; font-variant-numeric: tabular-nums">
<button type="button" disabled="disabled" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 24px; box-sizing: border-box; border: 1px solid #CDCDCD; border-radius: 8px; background: #FFFFFF; color: #161616; font: inherit; font-size: 16px; font-weight: 600; white-space: nowrap; cursor: pointer; flex: none; padding: 0 16px; border-color: #EFEFEF; color: #A6A6A6; font-weight: 400; font-variant-numeric: tabular-nums; cursor: default">52 秒后重发</button>
</div>
<span id="au-code-hint" style="font-size: 12px; line-height: 1.5; color: #6B6B6B">验证码已发送到 138****2046，10 分钟内有效。</span>
</div>

<label style="display: flex; align-items: center; gap: 12px; min-height: 40px; font-size: 14px; cursor: pointer; align-items: flex-start; margin-top: 16px; line-height: 1.6"><input type="checkbox" checked="checked" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: #161616; margin-top: 3px"><span>我已阅读并同意<a href="#" style="font-weight: 600; text-decoration: none">《用户协议》</a><a href="#" style="font-weight: 600; text-decoration: none">《隐私政策》</a>和<a href="#" style="font-weight: 600; text-decoration: none">《创作者协议》</a></span></label>

<a href="EditCard.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 24px; box-sizing: border-box; border: 0; border-radius: 8px; background: #161616; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; white-space: nowrap; cursor: pointer; text-decoration: none; width: 100%; margin-top: 24px">注册并继续</a>

<div aria-hidden="true" style="margin-top: 24px; display: flex; align-items: center; gap: 16px; font-size: 12px; color: #6B6B6B"><span style="flex: 1; height: 1px; background: #EFEFEF"></span>或<span style="flex: 1; height: 1px; background: #EFEFEF"></span></div>
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 24px; box-sizing: border-box; border: 1px solid #CDCDCD; border-radius: 8px; background: #FFFFFF; color: #161616; font: inherit; font-size: 16px; font-weight: 600; white-space: nowrap; cursor: pointer; width: 100%; margin-top: 24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l.9-4.4A8.5 8.5 0 1 1 20.5 12z"></path><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"></path></svg>使用微信继续</button>
<p style="margin: 24px 0 0; font-size: 12px; line-height: 1.6; color: #6B6B6B">注册后先完善名片，准备好了再开始接单。</p>
</form>
</main>
</div>
</div>
<a href="./" style="position: fixed; right: calc(24px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 50; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; color: #161616; font-family: 'Manrope', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h11M4.5 6.5h.01M4.5 12h.01M4.5 17.5h.01"></path></svg>全部页面</a>
<script>document.addEventListener("submit",function(e){e.preventDefault()});document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest('a[href="#"]');if(a){e.preventDefault()}});</script>
</body>
</html>
