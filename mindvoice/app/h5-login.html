<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>听屿 H5 · 手机号登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@500;600;900&display=swap">
<link rel="stylesheet" href="ds.css">
<script src="icons.js"></script>
<style>
/* H5 · 手机号登录 —— tokens only */
.phone { overflow: clip; display: flex; flex-direction: column; background: var(--surface); }
.phone > main { flex: 1; padding: 0 24px 24px; }
.h5-top { border-bottom-color: transparent; }
.h5-top .nb { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 0; background: none; color: var(--ink); }
.h5-top h1 { flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 600; }
.h5-top .sp { width: 36px; }

.head { padding: 18px 0 0; }
.head .brand-mark { width: 44px; height: 44px; border-radius: 13px; }
.head h2 { margin: 16px 0 4px; font-size: 26px; line-height: 1.3; }
.head p { margin: 0; font-size: 13.5px; color: var(--ink-3); }

.pending { margin-top: 20px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r-lg); background: var(--surface-2); border: 1px solid var(--line-2); }
.pending .avatar { object-position: top; }
.pending b { font-size: 14px; display: block; line-height: 1.35; }
.pending span { font-size: 12px; color: var(--ink-3); }
.pending .lock { font-size: 11px; color: var(--accent); display: block; margin-top: 1px; }

form { margin-top: 22px; display: grid; gap: 14px; }
.field { display: flex; align-items: center; height: 52px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); padding: 0 6px 0 14px; transition: border-color .15s, box-shadow .15s; }
.field:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.field .cc { display: inline-flex; align-items: center; gap: 2px; font-family: var(--font-num); font-weight: 600; padding-right: 12px; margin-right: 12px; border-right: 1px solid var(--line-2); color: var(--ink); height: 22px; }
.field .cc .ic { width: 14px; height: 14px; color: var(--ink-3); }
.field input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 16px; font-family: var(--font-num); letter-spacing: .02em; height: 100%; }
.field input::placeholder { font-family: var(--font-body); letter-spacing: 0; color: var(--ink-4); font-size: 15px; }
.field .clr { border: 0; background: none; color: var(--ink-4); width: 32px; height: 32px; display: grid; place-items: center; }
.field .getcode { border: 0; background: none; color: var(--primary); font-weight: 600; font-size: 14px; padding: 0 10px; height: 36px; white-space: nowrap; border-left: 1px solid var(--line-2); }
.field .getcode[disabled] { color: var(--ink-4); cursor: default; font-family: var(--font-num); }
.err { font-size: 12px; color: var(--risk); margin-top: -6px; display: flex; align-items: center; gap: 4px; }
.err .ic { width: 14px; height: 14px; }

.agree { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--ink-3); line-height: 1.6; cursor: pointer; }
.agree input { position: absolute; opacity: 0; pointer-events: none; }
.agree .box { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-4); flex-shrink: 0; margin-top: 1px; display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.agree .box .ic { width: 12px; height: 12px; stroke-width: 3; }
.agree input:checked + .box { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.agree input:focus-visible + .box { outline: 2px solid var(--primary); outline-offset: 2px; }
.agree a { color: var(--primary); }
.agree.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.or { display: flex; align-items: center; gap: 12px; margin: 26px 0 16px; font-size: 12px; color: var(--ink-4); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.wx { width: 100%; }
.wx .g { width: 22px; height: 22px; border-radius: 6px; background: var(--ok); color: var(--surface); display: grid; place-items: center; }
.wx .g .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.alt { display: flex; justify-content: center; gap: 28px; margin-top: 18px; }
.alt button { border: 0; background: none; display: grid; justify-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-3); }
.alt span.c { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); }

.safe { margin-top: 26px; padding: 12px 14px; border-radius: var(--r); background: var(--primary-soft); color: var(--primary); font-size: 12px; display: grid; gap: 6px; }
.safe div { display: flex; gap: 6px; align-items: flex-start; }
.safe .ic { width: 15px; height: 15px; margin-top: 2px; }
.foot { text-align: center; font-size: 11px; color: var(--ink-4); padding: 0 24px 20px; }

.busy { position: fixed; inset: 0; z-index: 96; display: grid; place-items: center; }
.busy .box { background: var(--surface); border-radius: var(--r-lg); padding: 22px 26px; display: grid; justify-items: center; gap: 10px; box-shadow: var(--shadow-lg); font-size: 13.5px; min-width: 180px; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="phone">
  <header class="h5-top">
    <a class="nb" href="h5-counselor.html" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></a>
    <h1>登录</h1>
    <span class="sp"></span>
  </header>

  <main>
    <div class="head">
      <span class="brand-mark"><svg class="ic"><use href="#i-leaf"/></svg></span>
      <h2 class="display">登录后完成预约</h2>
      <p>未注册的手机号验证后将自动创建听屿账号</p>
    </div>

    <div class="pending">
      <img class="avatar" src="../assets/c-lin.jpg" alt="">
      <div><b>林知夏 · 第 1 次咨询</b><span id="pWhen">明天 11/16 周一 20:00 · 语音咨询</span><span class="lock"><svg class="ic ic-sm" style="vertical-align:-3px;margin-right:2px"><use href="#i-clock"/></svg>时段已为你保留 <span class="num" id="hold">14:59</span></span></div>
      <span class="price" id="pPrice">¥400</span>
    </div>

    <form id="f" novalidate>
      <label class="field">
        <span class="cc">+86<svg class="ic"><use href="#i-chevron-down"/></svg></span>
        <input id="tel" type="tel" inputmode="numeric" maxlength="13" placeholder="请输入手机号" autocomplete="tel" aria-label="手机号">
        <button class="clr" type="button" id="clr" hidden aria-label="清空"><svg class="ic ic-sm"><use href="#i-close"/></svg></button>
      </label>
      <label class="field">
        <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码" autocomplete="one-time-code" aria-label="验证码">
        <button class="getcode" type="button" id="getcode">获取验证码</button>
      </label>
      <div class="err" id="err" hidden><svg class="ic"><use href="#i-alert"/></svg><span></span></div>
      <label class="agree" id="agree">
        <input type="checkbox" id="ok">
        <span class="box"><svg class="ic"><use href="#i-check"/></svg></span>
        <span>我已阅读并同意 <a href="#" data-toast="《用户服务协议》">《用户服务协议》</a><a href="#" data-toast="《隐私政策》">《隐私政策》</a><a href="#" data-toast="《心理咨询知情同意书》">《心理咨询知情同意书》</a>，了解 AI 接待助手不提供诊断与治疗</span>
      </label>
      <button class="btn btn-primary btn-lg btn-block" type="submit" id="submit">登录并继续预约</button>
    </form>

    <div class="or">其他登录方式</div>
    <button class="btn btn-ghost btn-lg wx" type="button" id="wx"><span class="g"><svg class="ic"><use href="#i-chat"/></svg></span>微信一键登录</button>
    <div class="alt">
      <button type="button" data-toast="本机号码一键登录需在 App 内使用"><span class="c"><svg class="ic"><use href="#i-phone"/></svg></span>本机号码</button>
      <button type="button" data-toast="请使用 Apple 设备访问"><span class="c"><svg class="ic"><use href="#i-user"/></svg></span>Apple ID</button>
    </div>

    <div class="safe">
      <div><svg class="ic"><use href="#i-shield"/></svg><span>手机号仅用于登录和咨询提醒，不会展示给咨询师</span></div>
      <div><svg class="ic"><use href="#i-lock"/></svg><span>你在小屿的接待记录将自动保存到这个账号</span></div>
    </div>
  </main>
  <div class="foot">遇到问题？联系客服 400-820-1356（9:00–23:00）</div>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="busy" id="busy" hidden><div class="box"><span class="spin"></span><span id="busyTxt">正在登录…</span></div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  try { var bk = JSON.parse(sessionStorage.getItem('tingyu-booking') || 'null'); if (bk) { $('pWhen').textContent = bk.when + ' · ' + bk.mode; $('pPrice').textContent = '¥' + bk.price; } } catch (e) { /* ignore */ }
  // hold countdown
  var hold = 15 * 60 - 1;
  setInterval(function () { if (hold > 0) hold--; $('hold').textContent = String(Math.floor(hold / 60)).padStart(2, '0') + ':' + String(hold % 60).padStart(2, '0'); }, 1000);

  function digits(v) { return v.replace(/\D/g, ''); }
  function fmt(d) { return d.length > 7 ? d.slice(0, 3) + ' ' + d.slice(3, 7) + ' ' + d.slice(7, 11) : d.length > 3 ? d.slice(0, 3) + ' ' + d.slice(3) : d; }
  function showErr(t) { var e = $('err'); e.hidden = !t; e.querySelector('span').textContent = t || ''; }
  var tel = $('tel');
  tel.addEventListener('input', function () { var d = digits(tel.value).slice(0, 11); tel.value = fmt(d); $('clr').hidden = !d; showErr(''); });
  $('clr').addEventListener('click', function () { tel.value = ''; this.hidden = true; tel.focus(); });
  $('code').addEventListener('input', function () { this.value = digits(this.value).slice(0, 6); showErr(''); });
  function validTel() { return /^1[3-9]\d{9}$/.test(digits(tel.value)); }
  function needAgree() {
    if ($('ok').checked) return false;
    var a = $('agree'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
    toast('请先阅读并勾选同意协议'); return true;
  }

  var timer = null;
  $('getcode').addEventListener('click', function () {
    if (!validTel()) { showErr('请输入正确的 11 位手机号'); tel.focus(); return; }
    var b = this, left = 60, d = digits(tel.value);
    b.disabled = true; b.textContent = '60s 后重发';
    toast('验证码已发送至 ' + d.slice(0, 3) + '****' + d.slice(7));
    setTimeout(function () { if (!$('code').value) { $('code').value = '246810'; toast('已自动填入短信验证码（演示）'); } }, 1600);
    timer = setInterval(function () {
      left--; b.textContent = left + 's 后重发';
      if (left <= 0) { clearInterval(timer); b.disabled = false; b.textContent = '重新获取'; }
    }, 1000);
    $('code').focus();
  });

  function go(msg) {
    $('busyTxt').textContent = msg; $('scrim').hidden = false; $('busy').hidden = false;
    setTimeout(function () { $('busyTxt').textContent = '登录成功'; }, 900);
    setTimeout(function () { location.href = 'h5-pay.html'; }, 1300);
  }
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!validTel()) { showErr('请输入正确的 11 位手机号'); tel.focus(); return; }
    if (!/^\d{6}$/.test($('code').value)) { showErr('请输入 6 位短信验证码'); $('code').focus(); return; }
    if (needAgree()) return;
    go('正在登录…');
  });
  $('wx').addEventListener('click', function () { if (needAgree()) return; go('正在跳转微信授权…'); });
  document.querySelectorAll('[data-toast]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); toast(a.getAttribute('data-toast')); }); });
})();
</script>
</body>
</html>
