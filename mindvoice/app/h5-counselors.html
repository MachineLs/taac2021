<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>听屿 H5 · 找咨询师</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@500;600;900&display=swap">
<link rel="stylesheet" href="ds.css">
<script src="icons.js"></script>
<style>
/* H5 · 咨询师列表 —— tokens only */
.phone { overflow: clip; display: flex; flex-direction: column; }
.phone > main { flex: 1; padding: 0 14px 20px; }
.h5-top .nb { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; border: 0; background: none; color: var(--ink); }
.h5-top h1 { flex: 1; margin: 0; text-align: center; font-size: 16px; font-weight: 600; }

.filters { position: sticky; top: 52px; z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line-2); padding: 10px 0 10px; }
.filters .search { margin: 0 14px; background: var(--surface-2); height: 38px; }
.filters .search button { border: 0; background: none; color: var(--ink-4); display: grid; place-items: center; padding: 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips .chip { cursor: pointer; flex-shrink: 0; }
.chips .chip.on { font-weight: 600; }
.sortbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; }
.sortbar .seg button { height: 28px; padding: 0 12px; }
.sortbar .fbtn { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; font-size: 13px; color: var(--ink-2); padding: 0; }
.sortbar .fbtn.on { color: var(--primary); font-weight: 600; }
.sortbar .fbtn .ic { width: 16px; height: 16px; }

.tip { margin: 12px 0 0; padding: 10px 12px; border-radius: var(--r); background: var(--primary-soft); color: var(--primary); font-size: 12.5px; display: flex; gap: 8px; align-items: center; }
.tip a { margin-left: auto; font-weight: 600; white-space: nowrap; }
.count { font-size: 12px; color: var(--ink-3); margin: 12px 2px 8px; display: flex; justify-content: space-between; }

.list-c { display: grid; gap: 10px; }
.cc { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 14px; position: relative; }
.cc .ph { width: 76px; height: 92px; border-radius: var(--r); object-fit: cover; object-position: top; }
.cc .nm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cc .nm b { font-size: 16px; }
.cc .ti { font-size: 12px; color: var(--ink-3); line-height: 1.45; margin-top: 1px; }
.cc .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.cc .meta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--ink-3); margin-top: 7px; }
.cc .foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding-top: 10px; border-top: 1px dashed var(--line-2); }
.cc .foot .when { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
.cc .foot .when .ic { width: 15px; height: 15px; color: var(--ok); }
.cc .foot .price { margin-left: auto; font-size: 17px; }
.cc .match { position: absolute; right: 14px; top: 14px; }
.cc .modes { display: inline-flex; gap: 3px; color: var(--ink-4); }
.cc .modes .ic { width: 14px; height: 14px; }

.empty { text-align: center; padding: 40px 16px; color: var(--ink-3); font-size: 13px; }
.empty .ic { width: 36px; height: 36px; color: var(--ink-4); margin: 0 auto 8px; display: block; }
.end { text-align: center; font-size: 11.5px; color: var(--ink-4); padding: 16px 0 4px; }

.sheet-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 95; display: flex; justify-content: center; }
.sheet { width: 100%; max-width: 390px; padding: 8px 18px 18px; animation: up .28s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.sheet .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { margin: 0 0 14px; font-size: 17px; text-align: center; }
.sheet h4 { margin: 14px 0 8px; font-size: 13.5px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts .chip { cursor: pointer; }
.sheet .acts { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 20px; }
</style>
</head>
<body>
<div class="phone">
  <header class="h5-top">
    <a class="nb" href="h5-summary.html" aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></a>
    <h1>找咨询师</h1>
    <button class="nb" type="button" data-toast="链接已复制，可以发给信任的朋友" aria-label="分享"><svg class="ic"><use href="#i-share"/></svg></button>
  </header>

  <div class="filters">
    <label class="search"><svg class="ic ic-sm"><use href="#i-search"/></svg><input id="q" type="search" placeholder="搜索姓名、困扰或疗法，如「失眠」「CBT」" aria-label="搜索咨询师"><button type="button" id="qClear" hidden aria-label="清空"><svg class="ic ic-sm"><use href="#i-close"/></svg></button></label>
    <div class="chips" id="chips" role="tablist" aria-label="困扰类型"></div>
    <div class="sortbar">
      <div class="seg" id="sort" role="group" aria-label="排序">
        <button type="button" class="on" data-k="rec">推荐</button>
        <button type="button" data-k="rate">评分</button>
        <button type="button" data-k="price">价格<span id="pdir">↑</span></button>
      </div>
      <button class="fbtn" type="button" id="fbtn"><svg class="ic"><use href="#i-filter"/></svg><span id="fTxt">筛选</span></button>
    </div>
  </div>

  <main>
    <div class="tip"><svg class="ic ic-sm"><use href="#i-sparkle"/></svg><span>已按你的接待小结（失眠 · 职场压力）优先排序</span><a href="h5-summary.html">查看小结</a></div>
    <div class="count"><span id="cnt">共 9 位咨询师</span><span>全部持证 · 平台实名审核</span></div>
    <div class="list-c" id="list"></div>
    <div class="empty" id="empty" hidden><svg class="ic"><use href="#i-search"/></svg>没有找到符合条件的咨询师<br><button class="btn btn-soft btn-sm" type="button" id="resetAll" style="margin-top:12px">清除筛选</button></div>
    <div class="end" id="end">已显示全部 · 找不到合适的？<a href="h5-voice.html" style="color:var(--primary)">和小屿说说</a></div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fTitle">
    <div class="grab"></div>
    <h2 id="fTitle">筛选</h2>
    <h4>单次价格</h4>
    <div class="opts" data-g="price">
      <button class="chip on" type="button" data-v="all">不限</button>
      <button class="chip" type="button" data-v="0-400">¥400 及以下</button>
      <button class="chip" type="button" data-v="401-600">¥401–600</button>
      <button class="chip" type="button" data-v="601-9999">¥600 以上</button>
    </div>
    <h4>从业年限</h4>
    <div class="opts" data-g="years">
      <button class="chip on" type="button" data-v="0">不限</button>
      <button class="chip" type="button" data-v="5">5 年以上</button>
      <button class="chip" type="button" data-v="10">10 年以上</button>
    </div>
    <h4>可约时间</h4>
    <div class="opts" data-g="soon">
      <button class="chip on" type="button" data-v="all">不限</button>
      <button class="chip" type="button" data-v="tomorrow">明天前可约</button>
    </div>
    <div class="acts">
      <button class="btn btn-ghost" type="button" id="fReset">重置</button>
      <button class="btn btn-primary" type="button" id="fApply">查看结果</button>
    </div>
  </div>
</div>

<script>
(function () {
  var C = [
    { id: 'lin', name: '林知夏', title: '国家二级心理咨询师 · 临床心理学硕士', years: 8, rating: 4.97, sessions: 2310, price: 400, img: 'c-lin', tags: ['焦虑', '失眠', '职场压力'], method: 'CBT', match: 96, when: '明天 20:00', soon: 1, modes: 'phone,video,chat' },
    { id: 'zhou', name: '周以宁', title: '婚姻家庭治疗师 · EFT 认证', years: 11, rating: 4.95, sessions: 3480, price: 600, img: 'c-zhou', tags: ['亲密关系', '婚姻', '家庭沟通'], method: 'EFT', match: 62, when: '周三 19:00', soon: 0, modes: 'phone,video' },
    { id: 'he', name: '何清', title: '正念减压导师 · ACT 治疗师', years: 9, rating: 4.96, sessions: 2890, price: 450, img: 'c-he', tags: ['情绪调节', '正念', '自我关怀'], method: 'ACT', match: 89, when: '后天 19:00', soon: 0, modes: 'phone,video,chat' },
    { id: 'xu', name: '许蔓', title: '青少年与亲子咨询师', years: 6, rating: 4.93, sessions: 1520, price: 380, img: 'c-xu', tags: ['青少年', '亲子', '学业压力'], method: '家庭系统', match: 58, when: '明天 18:00', soon: 1, modes: 'video,chat' },
    { id: 'song', name: '宋语棠', title: '创伤治疗师 · EMDR 认证', years: 12, rating: 4.98, sessions: 4120, price: 680, img: 'c-song', tags: ['创伤', '哀伤', '惊恐'], method: 'EMDR', match: 71, when: '周四 20:00', soon: 0, modes: 'video' },
    { id: 'chen', name: '陈牧', title: '精神科主治医师 · 医学博士', years: 15, rating: 4.96, sessions: 5260, price: 800, img: 'c-chen', tags: ['抑郁评估', '药物咨询', '双相'], method: '精神科评估', match: 74, when: '周五 10:00', soon: 0, modes: 'video' },
    { id: 'fang', name: '方宁', title: '企业 EAP 顾问 · 职业发展教练', years: 7, rating: 4.94, sessions: 1980, price: 420, img: 'c-fang', tags: ['职业倦怠', '领导力', '团队冲突'], method: '焦点解决', match: 86, when: '明天 21:00', soon: 1, modes: 'phone,video,chat' },
    { id: 'wang', name: '王屿川', title: '精神分析取向咨询师', years: 10, rating: 4.92, sessions: 2640, price: 550, img: 'c-wang', tags: ['自我探索', '男性心理', '关系模式'], method: '精神动力学', match: 68, when: '周三 21:00', soon: 0, modes: 'phone,video' },
    { id: 'gu', name: '顾言', title: '高校心理咨询师', years: 5, rating: 4.91, sessions: 1170, price: 300, img: 'c-gu', tags: ['大学生', '人际', '职业迷茫'], method: '人本主义', match: 64, when: '今天 22:00', soon: 1, modes: 'phone,chat' }
  ];
  var CHIPS = ['全部', '焦虑', '失眠', '职场压力', '情绪调节', '职业倦怠', '亲密关系', '人际', '青少年', '创伤', '抑郁评估', '自我探索'];
  var st = { chip: '全部', q: '', sort: 'rec', pAsc: true, price: 'all', years: 0, soon: 'all' };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  $('chips').innerHTML = CHIPS.map(function (c, i) { return '<button type="button" role="tab" class="chip' + (i ? '' : ' on') + '" aria-selected="' + (i ? 'false' : 'true') + '">' + c + '</button>'; }).join('');
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    st.chip = b.textContent;
    $('chips').querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    render();
  });
  $('q').addEventListener('input', function () { st.q = this.value.trim(); $('qClear').hidden = !st.q; render(); });
  $('qClear').addEventListener('click', function () { $('q').value = ''; st.q = ''; this.hidden = true; render(); });
  $('sort').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k === 'price' && st.sort === 'price') st.pAsc = !st.pAsc;
    st.sort = b.dataset.k; $('pdir').textContent = st.pAsc ? '↑' : '↓';
    this.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
  });

  var ICON = { phone: 'phone', video: 'video', chat: 'chat' };
  function card(c) {
    return '<a class="card cc" href="h5-counselor.html">' +
      '<img class="ph" src="../assets/' + c.img + '.jpg" alt="' + esc(c.name) + '">' +
      '<div class="grow">' +
        '<div class="nm"><b>' + esc(c.name) + '</b><span class="tag tag-plain">' + esc(c.method) + '</span></div>' +
        '<div class="ti">' + esc(c.title) + '</div>' +
        '<div class="tags">' + c.tags.map(function (t) { return '<span class="tag' + (t === st.chip ? ' tag-accent' : '') + '">' + esc(t) + '</span>'; }).join('') + '</div>' +
        '<div class="meta"><span class="rating"><svg class="ic ic-sm" style="fill:currentColor;stroke:none"><use href="#i-star"/></svg>' + c.rating.toFixed(2) + '</span><span class="num">' + c.years + ' 年</span><span class="num">' + c.sessions.toLocaleString('en-US') + ' 次</span><span class="modes">' + c.modes.split(',').map(function (m) { return '<svg class="ic"><use href="#i-' + ICON[m] + '"/></svg>'; }).join('') + '</span></div>' +
      '</div>' +
      (c.match >= 85 ? '<span class="tag tag-accent match">匹配 ' + c.match + '%</span>' : '') +
      '<div class="foot"><span class="when"><svg class="ic"><use href="#i-clock"/></svg>最近可约 ' + esc(c.when) + '</span><span class="price">¥' + c.price + '<small>/次</small></span><span class="btn btn-soft btn-sm">预约</span></div>' +
    '</a>';
  }
  function render() {
    var q = st.q.toLowerCase();
    var pr = st.price === 'all' ? null : st.price.split('-').map(Number);
    var out = C.filter(function (c) {
      if (st.chip !== '全部' && c.tags.indexOf(st.chip) < 0) return false;
      if (q && (c.name + c.title + c.tags.join('') + c.method).toLowerCase().indexOf(q) < 0) return false;
      if (pr && (c.price < pr[0] || c.price > pr[1])) return false;
      if (c.years < st.years) return false;
      if (st.soon === 'tomorrow' && !c.soon) return false;
      return true;
    });
    out.sort(function (a, b) {
      if (st.sort === 'rate') return b.rating - a.rating;
      if (st.sort === 'price') return st.pAsc ? a.price - b.price : b.price - a.price;
      return b.match - a.match;
    });
    $('list').innerHTML = out.map(card).join('');
    $('cnt').textContent = (out.length === C.length ? '共 ' : '筛选出 ') + out.length + ' 位咨询师';
    $('empty').hidden = out.length > 0; $('end').hidden = out.length === 0;
    var n = (st.price !== 'all') + (st.years > 0) + (st.soon !== 'all');
    $('fTxt').textContent = n ? '筛选 · ' + n : '筛选'; $('fbtn').classList.toggle('on', n > 0);
  }

  // filter sheet
  function open() { $('scrim').hidden = false; $('sheetWrap').hidden = false; }
  function close() { $('scrim').hidden = true; $('sheetWrap').hidden = true; }
  $('fbtn').addEventListener('click', open);
  $('scrim').addEventListener('click', close);
  document.querySelectorAll('.opts').forEach(function (g) {
    g.addEventListener('click', function (e) {
      var b = e.target.closest('.chip'); if (!b) return;
      g.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); });
    });
  });
  function readSheet() {
    var v = function (g) { return document.querySelector('.opts[data-g="' + g + '"] .chip.on').dataset.v; };
    st.price = v('price'); st.years = Number(v('years')); st.soon = v('soon');
  }
  function resetSheet() { document.querySelectorAll('.opts').forEach(function (g) { g.querySelectorAll('.chip').forEach(function (x, i) { x.classList.toggle('on', i === 0); }); }); }
  $('fApply').addEventListener('click', function () { readSheet(); close(); render(); });
  $('fReset').addEventListener('click', resetSheet);
  $('resetAll').addEventListener('click', function () {
    resetSheet(); readSheet(); st.q = ''; $('q').value = ''; $('qClear').hidden = true;
    st.chip = '全部'; $('chips').querySelectorAll('.chip').forEach(function (x, i) { x.classList.toggle('on', i === 0); });
    render();
  });
  document.querySelectorAll('[data-toast]').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); toast(a.getAttribute('data-toast')); }); });
  render();
})();
</script>
</body>
</html>
